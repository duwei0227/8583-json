name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  rust:
    name: Rust 核心
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # 只检查编解码 crate；桌面壳在 desktop 任务里构建
      - run: cargo clippy -p iso8583-core -p iso8583-wasm --all-targets -- -D warnings
      - run: cargo test -p iso8583-core
      - name: 生成的 TypeScript 类型与 Rust 定义一致
        run: git diff --exit-code -- src/codec/types

  web:
    name: Web 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: pnpm test
      - name: 检查 Cloudflare 部署配置
        run: pnpm exec wrangler deploy --dry-run
      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps chromium
      - name: 端到端测试
        run: pnpm test:e2e
      - name: 上传端到端测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop:
    name: 桌面端编译（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p dist
      - run: cargo clippy -p iso8583-desktop -- -D warnings
